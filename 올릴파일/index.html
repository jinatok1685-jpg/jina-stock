<script>
// (10/22) 📲 앱으로 설치 단추: 안드로이드는 바로 설치 창, 아이폰은 방법 안내, 이미 설치했으면 숨김
(function () {
  if (!location.protocol.startsWith("http")) return;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone) return;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua);
  const inapp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
  let ev = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ev = e; show(); });
  window.addEventListener("appinstalled", () => { const b = document.getElementById("pwaBar"); if (b) b.remove(); });
  function guide(txt) {
    let g = document.getElementById("pwaGuide");
    if (!g) {
      g = document.createElement("div"); g.id = "pwaGuide";
      g.style.cssText = "margin:8px 0 0;padding:10px 12px;border-radius:8px;background:#fff;color:#222;font-size:14px;line-height:1.6;border:1px solid #ccc";
      document.getElementById("pwaBar").appendChild(g);
    }
    g.innerHTML = txt;
  }
  function show() {
    if (document.getElementById("pwaBar") || !document.body) return;
    const bar = document.createElement("div"); bar.id = "pwaBar";
    bar.style.cssText = "margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-family:inherit";
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "📲 明 주식 앱으로 설치";
    btn.style.cssText = "width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent,#2b6cb0);color:#fff;font-size:16px;font-weight:bold;cursor:pointer";
    btn.onclick = async () => {
      if (ev) { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome === "accepted") bar.remove(); ev = null; return; }
      if (inapp) guide("지금은 앱 안 브라우저예요. 오른쪽 위(또는 아래) 메뉴에서 <b>다른 브라우저로 열기</b>를 누른 뒤, 이 단추를 다시 눌러 주세요.");
      else if (ios) guide("사파리 아래쪽 <b>공유 단추(□↑)</b> → <b>홈 화면에 추가</b> → <b>추가</b>를 누르세요.");
      else guide("브라우저 메뉴(<b>⋮</b> 또는 <b>≡</b>) → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요.");
    };
    bar.appendChild(btn);
    const host = document.querySelector(".wrap") || document.getElementById("app") || document.body;
    host.insertBefore(bar, host.firstChild);
  }
  const later = () => { if (ios || inapp || /Android/.test(ua)) setTimeout(() => { if (!ev) show(); }, 1500); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", later); else later();
})();
</script>

    else if (r.previous_high_gap != null) s += `<span class="pos-below" title="전고점 ${num(r.previous_high)}원">전고점 ${Number(r.previous_high_gap).toFixed(1)}%</span>`;
    if (holdOf(r)) s += '<span class="ic">👌</span>';
    else if (nearOf(r)) s += '<span class="bd near" title="오후 지지 기준 다섯 개 중 네 개 충족">🟡 거의</span>';

    if (r.warn_state) s += `<span class="bd w" title="${esc(r.warn_state)}">⚠</span>`;
    return s;
}
function rowHtml(r) {
    return `<tr data-c="${esc(r.code)}"${isTop(r) || r.btp === 2 ? ` class="${[isTop(r) ? "leadrow" : "", r.btp === 2 ? "fire" : ""].join(" ").trim()}"` : ""}>

        <td>${r.lx.tvx == null ? "-" : num(r.lx.tvx, 1) + "<small>배</small>"}${r.lx.turn != null ? `<br><small>회전 ${num(r.lx.turn, 1)}%</small>` : ""}</td>
        <td><span class="g ${esc(r.cg)}">${esc(r.cg || "-")}</span> <small>${r.cs ?? "-"}</small></td>
        <td class="hm">${esc(r.phase || "")}</td></tr>`;
}
const THEAD = `<thead><tr><th data-s="name">종목</th><th data-s="chg">현재가·등락</th><th data-s="tval">거래대금</th>
    <th data-s="tvx">평소 대비</th><th data-s="cs">종가 등급</th><th class="hm">단계</th></tr></thead>`;

function groups(rows) {
    const m = {};
    rows.forEach((r) => { const k = r.sector || "업종 정보 없음"; (m[k] = m[k] || []).push(r); });
    return Object.entries(m).map(([sec, list]) => ({
        sec, list, n: list.length,
        tval: list.reduce((s, r) => s + (r.lx.tval || 0), 0),
        avg: list.reduce((s, r) => s + (r.lx.chg || 0), 0) / list.length,
        btp: Math.max(0, ...list.map((r) => r.btp || 0)),
    })).sort((a, b) => b.btp - a.btp || b.n - a.n || b.tval - a.tval);
}

function render() {
    const q = "", pv = "";
    const rows = DATA.filter((r) => (!q || (r.name || "").toLowerCase().includes(q) || (r.code || "").includes(q))
        && posMatch(r, pv) && (!themePick || (r.lx.th || []).includes(themePick) || r.sector === themePick));
    $("pick").innerHTML = themePick ? `<button type="button" class="tchip on" id="unpick">🔥 ${esc(themePick)} 종목만 보는 중 ✕</button>` : "";
    if (!DATA.length) {
        $("list").innerHTML = `<div class="empty">오늘은 조건식 '${esc(META.cond)}'에 걸린 종목이 없어요.<br><small>시장 전체가 약한 날엔 하나도 안 나올 수 있어요.</small></div>`;
        return;
    }
    if (!rows.length) { $("list").innerHTML = `<div class="empty">${q ? `"${esc(q)}"에 맞는 ` : "선택한 표시에 맞는 "}종목이 없어요.</div>`; return; }
    if (view === "all") {
        $("list").innerHTML = `<div class="card"><table>${THEAD}<tbody>${sorted(rows).map(rowHtml).join("")}</tbody></table></div>`;
    } else {
        $("list").innerHTML = groups(rows).map((g) => `<div class="card">
            <div class="chead"><h3>${esc(g.sec)}</h3><span class="s">${g.n}종목 · 거래대금 합 ${num(g.tval)}억 · 평균 ${pct(g.avg)}</span></div>
            <table>${THEAD}<tbody>${[...sorted(g.list.filter(isTop)), ...sorted(g.list.filter((r) => !isTop(r)))].map(rowHtml).join("")}</tbody></table></div>`).join("");
    }
}
function renderTop() {
    let h = "";

        const tip = CORE.market ? `평균 ${sg(t.chg)} · 상승 ${t.up}/${t.n}종목 · 대장${t.fb ? "(목록 안)" : ""} ` + ((t.top || []).map((m) => `${m.name} ${sg(m.chg)}`).join(", ") || "-")
            : `목록 안 ${t.n}종목 · 평균 ${sg(t.chg)}`;
        const info = CORE.market ? `<small>${sg(t.chg)} · 상승 ${t.up}/${t.n}</small>` : `<small>${sg(t.chg)}</small>`;
        return `<button type="button" class="tchip core${t.mine ? "" : " none"}" data-pick="${esc(t.name)}" title="${esc(tip)}">${esc(t.name)} ${info} <b>${t.mine || 0}</b></button>`;
    }).join("") + `</div>`;
    else h += `<div class="toprow"><span class="lab">🔥 오늘의 핵심 테마</span><small class="rk">조건(종목 5~40개 · 상승 60%↑)에 맞는 테마가 없어요</small></div>`;
    const lead = th.filter((t) => (t.top || []).length);
    if (lead.length) h += `<div class="toprow"><span class="lab">🏅 테마 대장</span>` + lead.map((t) => {
        const m = t.top[0], mine = DATA.some((r) => r.code === m.code);
        const rs = m.res ? ` <small>· ${num(m.res)}원 ${pct(m.res_pct)}</small>${m.res_pct < 2 ? ' <b class="rwarn">⚠</b>' : ""}` : "";
        return `<span class="tl${mine ? " mine" : ""}">${esc(m.name)} <b>${sg(m.chg)}</b> <small>${esc(t.name)}${t.fb ? " · 목록 안" : ""}</small>${rs}</span>`;
    }).join("") + `</div>`;
    const gs = groups(DATA).filter((g) => g.sec !== "업종 정보 없음").slice(0, 5);
    if (gs.length) h += `<div class="toprow">` + gs.map((g) =>
        `<button type="button" class="tchip" data-sec="${esc(g.sec)}">${esc(g.sec)} <b>${g.n}</b></button>`).join("") + `</div>`;
    $("top").innerHTML = h;
}

const IC_UP = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 14V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IC_RUN = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M1.5 13.5 5.5 8.5 8.5 11 14 3.5M9.5 3.3H14V7.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function sum3(r) {
    const flow = [r.wave_phase, r.wave_event, r.wave_small].filter(Boolean).map(esc).join(" · ") || esc(r.trend || "-");
    let pos = esc(r.plan_info || "-");
    const ma = r.ma_support || "";
    if (/20선[^·]*이탈/.test(ma)) pos = `<b class="${/소폭/.test(ma) ? "" : "d"}">${/소폭/.test(ma) ? "20일선 소폭 이탈" : "⚠ 20일선 이탈"}</b> · ` + pos;
    const sigs = [["sig_breakout", "up"], ["sig_box", "up"], ["sig_ma5", "up"], ["sig_support", "sup"], ["sig_broken", "dn"]]
        .filter(([k]) => r[k]).map(([k, c]) => `<span class="sig ${c}">${esc(r[k])}</span>`);
    const risk = r.risk && r.risk !== "특별한 위험 없음" ? `주의: ${esc(r.risk)}` : "";
    const sig = sigs.join("") + (risk ? (sigs.length ? " · " : "") + risk : "") || "눈에 띄는 신호·주의 없음";
    return `<div class="sum3"><div class="k">🌊 흐름</div><div class="v">${flow}</div>
        <div class="k">📍 위치</div><div class="v">${pos}</div>
        <div class="k">⚡ 신호·주의</div><div class="v">${sig}</div></div>`;
}
// (10/16) 하루 흐름 그래프 (5분봉 종가): 전일 종가 점선, 11시·13시 구분선, 오전 고점과 -3% 띠
function minuteHtml(r) {
    const M = r.lx.mn;
    if (!M || !Array.isArray(M.c) || M.c.length < 2) return "";
    const W = 360, H = 150, P = { l: 4, r: 4, t: 14, b: 16 };
    const lowBand = M.amh * (1 - M.hold / 100);
    const vals = [...M.c, r.lx.pc || M.c[0], M.amh, lowBand];
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const x = (i) => P.l + i / (M.c.length - 1) * (W - P.l - P.r);
    const y = (v) => P.t + (1 - (v - mn) / ((mx - mn) || 1)) * (H - P.t - P.b);
    const iAm = M.t.findIndex((t) => t >= "1100"), iPm = M.t.findIndex((t) => t >= "1300");
    const up = M.c[M.c.length - 1] >= (r.lx.pc || 0);
    const path = M.c.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
    const vline = (i, lab) => i > 0 ? `<line class="vl" x1="${x(i)}" x2="${x(i)}" y1="${P.t}" y2="${H - P.b}"/>
        <text x="${x(i) + 3}" y="${H - 5}">${lab}</text>` : "";
    const band = iPm > 0 ? `<rect class="band" x="${x(iPm)}" y="${y(M.amh)}" width="${W - P.r - x(iPm)}" height="${Math.max(1, y(lowBand) - y(M.amh))}"/>` : "";
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="오늘 5분봉 가격 흐름">
        ${band}
        <line class="pc" x1="${P.l}" x2="${W - P.r}" y1="${y(r.lx.pc)}" y2="${y(r.lx.pc)}"/>
        <line class="amh" x1="${P.l}" x2="${W - P.r}" y1="${y(M.amh)}" y2="${y(M.amh)}"/>
        ${vline(iAm, "11:00")}${vline(iPm, "13:00")}
        <path class="ln ${up ? "u" : "d"}" d="${path}"/>
        <text x="${P.l}" y="${H - 5}">09:00</text><text x="${W - P.r}" y="${H - 5}" text-anchor="end">15:30</text>
        <text x="${P.l + 2}" y="${Math.max(11, y(M.amh) - 3)}">오전 고점 ${num(M.amh)}</text>
        <text x="${W - P.r}" y="${Math.min(H - P.b - 2, y(r.lx.pc) + 12)}" text-anchor="end">전일 종가</text>
    </svg>`;
    const c = M.chk || [];
    const item = (ok, t) => `<div class="${ok ? "y" : "n"}">${ok ? "✔" : "✕"} ${t}</div>`;
    const th = M.th || [50, 70];
    const tag = M.ok ? '<span class="bd hold">🟢 오후 지지</span>' : M.near ? '<span class="bd near">🟡 거의 (4/5)</span>' : "";
    return `<div class="mbox"><h4>⏱ 오늘 흐름 (5분봉) ${tag}</h4>${svg}
        <div class="chk">
            ${item(c[0], `오전(11시 전) 거래량이 하루의 ${M.amv}% (기준 ${th[0]}% 이상)`)}
            ${item(c[1], `11시까지 하루 상승분의 ${M.amg}%를 오름 (기준 ${th[1]}% 이상)`)}
            ${item(c[2], `오후 최저가가 오전 고점 대비 ${M.drop}% (기준 -${M.hold}% 안쪽) · 오후 범위 ${num(M.pml)}~${num(M.pmh)}원`)}
            ${item(c[3], `오후 봉당 거래량이 오전의 ${M.pmv}% (기준 100% 미만 = 조용한 횡보)`)}
            ${item(c[4], "종가가 오후 가격대의 위쪽 절반")}
        </div></div>`;
}
function csHtml(r) {
    const parts = r.csp || [];
    const rows = parts.map(([k, pt, t]) => `<tr><td style="text-align:left">${esc(k)}</td><td style="text-align:left">${esc(t)}</td>
        <td class="pt${pt < 0 ? " m" : ""}">${pt > 0 ? "+" : ""}${pt}</td></tr>`).join("");
    return `<div class="csbox"><h4>🎯 종가 점수 ${r.cs ?? 0}점 · <span class="g ${esc(r.cg)}">${esc(r.cg || "-")}</span></h4>

        ${r.cap ? `<div class="sec capn">⛔ 등급 제한: 점수로는 ${esc(r.cg0)} · ${esc(r.cap)} → <b>${esc(r.cg)}</b></div>` : ""}
        <div class="sec" style="margin:6px 0 0;color:var(--sub);font-size:12px">배점: 오후 지지 25 · 평소 대비 쏠림 20 · 핵심 테마 15 · 신고가·주도력 15 · 전일 연속성 10 · 테마 대장 10 · 고가 마감 5 (투자경고·위험 -15) · S는 🟢, A는 🟢·🟡 필수</div></div>`;
}
function leadText(r) {
    const th = (CORE.themes || []).find((x) => x.name === r.lead_of);
    const tag = CORE.market && !(th && th.fb) ? "전체 구성 종목" : "목록 안 종목";
    if (isTop(r)) return `🏅 핵심 테마 '${esc(r.lead_of || "")}' ${tag} 중 오늘 등락률이 가장 높음`;
    if (r.lead === "theme") return `'${esc(r.lead_of || "")}' ${tag} 중 ${r.lead_rank}번째로 강함 (등락률 순)`;
    const t = (CORE.themes || []).find((x) => (r.core || []).includes(x.name) && (x.top || []).length);
    return t ? `'${esc(t.name)}' 대장은 ${esc(t.top[0].name)} (${t.top[0].chg > 0 ? "+" : ""}${Number(t.top[0].chg).toFixed(1)}%) · 이 종목은 후발` : "";
}
function posText(r) {

    if (p === "hi") return "<b class='u'>신고가</b> (250일 고가 경신)";
    if (nearHiOf(r)) return `<b class='u'>신고가권</b> (오늘은 아님 · 전고점 ${num(r.previous_high)}원 ${pct(r.previous_high_gap)})`;

    return r.previous_high ? `전고점 ${num(r.previous_high)}원 아래 ${pct(r.previous_high_gap)}` : "-";
}
const invHtml = (t) => esc(t).replace(/순매수/g, '<span class="inv-b">순매수</span>').replace(/순매도/g, '<span class="inv-s">순매도</span>');

// (10/16) 다음 날 성적표
function sellText(nx) {   // (10/18) 플랜: 저항 지정가, 못 닿으면 10:00 (5분봉 162일 검증)
    return "다음 날 <b>저항가 지정가</b> → 못 닿으면 <b>10:00</b>" + (nx === true ? " <small>(넥스트레이드 종목)</small>" : "");

function resText(r) {
    const L = r.lx || {};
    if (!L.res) return "위쪽 저항: <b>없음</b> (종가 +1% 위에 전고점·이평선·매물대·라운드 피겨가 없음) → 시간 기준으로 매도";
    const more = (L.res_list || []).slice(1).map((x) => `${num(x[0])}원 ${pct(x[1])} ${esc(x[2])}`).join(" · ");
    const warn = L.res_pct != null && L.res_pct < 2 ? ` <b class="rwarn">⚠ 저항 +2% 미만</b>` : "";   // (10/17) 검증: +1~2% 저항은 평균 손해
    return `위쪽 저항: <b>${num(L.res)}원</b> (${pct(L.res_pct)}, <b>${esc(L.res_kind || "")}</b>)${warn}`
        + (more ? `<br><small style="color:var(--sub)">그 위 저항: ${more}</small>` : "");
}
// (10/18) 반원 게이지 (지나_종목조회와 같은 모양) - val 0~100, cuts = [왼쪽 구간 끝, 오른쪽 구간 시작]
function gaugeSvg(val, cuts, ends, ticks) {
    const W = 150, R = W / 2 - 9, cx = W / 2, cy = W / 2 + 2, sw = 13;
    const pt = (v, r) => { const a = Math.PI * (1 - v / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
    const arc = (a, b, cls) => {
        const [x1, y1] = pt(a, R), [x2, y2] = pt(b, R);
        return `<path class="${cls}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke-width="${sw}" fill="none"/>`;
    };
    const v = Math.max(0, Math.min(100, val));
    const [nx, ny] = pt(v, R - sw / 2 - 6);
    // (10/18) 눈금: ticks = [[위치 0~100, 굵게?], ...] - 띠 안쪽에 짧은 선, 굵은 것(가운데 기준선)은 길고 진하게
    const tk = (ticks || []).map(([p, big]) => {
        const [x1, y1] = pt(p, R - sw / 2 - 1), [x2, y2] = pt(p, R - sw / 2 - (big ? 10 : 5));
        return `<line class="gz-tick${big ? " big" : ""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-linecap="round"/>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${cy + 14}" width="${W}" height="${cy + 14}" aria-hidden="true">
        ${arc(0, cuts[0], "gz-lo")}${arc(cuts[0], cuts[1], "gz-mid")}${arc(cuts[1], 100, "gz-hi")}${tk}
        <line class="gz-needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke-width="3" stroke-linecap="round"/>
        <circle class="gz-hub" cx="${cx}" cy="${cy}" r="5"/>
        <text class="gz-end lo" x="4" y="${cy + 12}">${ends[0]}</text>
        <text class="gz-end hi" x="${W - 4}" y="${cy + 12}" text-anchor="end">${ends[1]}</text>
    </svg>`;
}
const GZ_MAX = 30, GZ_WEAK = 8, GZ_STRONG = 20;   // 주도 종목 수: 8 미만 약세 · 20 이상 강세 (10/18 검증)
function marketGauge() {
    const n = DATA.length;
    const [lab, cls, tip] = n < GZ_WEAK ? ["약세", "d", "금액 줄이기"] : n >= GZ_STRONG ? ["강세", "u", ""] : ["보통", "", ""];
    return `<div class="gz" title="조건식 '${esc(META.cond)}'에 걸린 종목 수 · 8개 미만 약세(검증 승률 50%·평균 +1.7%) · 20개 이상 강세">
        <div class="gz-t">주도 ${n}종목</div>
        ${gaugeSvg(Math.min(n, GZ_MAX) / GZ_MAX * 100, [GZ_WEAK / GZ_MAX * 100, GZ_STRONG / GZ_MAX * 100], ["약세", "강세"],
            [0, 5, 10, 15, 20, 25, 30].map((k) => [k / GZ_MAX * 100, k === GZ_MAX / 2]))}
        <div class="gz-v ${cls}">${lab}</div>${tip ? `<div class="gz-s">${tip}</div>` : ""}</div>`;
}
// (10/18) 원탑 주요거래원·유형 (표시만). ✓ = 집중도 낮음+오늘 매수 또는 오늘 매수 5~10% / ⚠ = 2만원 이상+회전율 30% 미만
const TYPE_PRICE = 20000, TYPE_TURN = 30;
function jpText(t) {
    const J = t.jp;
    if (!J) return "";
    const lvl = J.lvl ? ` ${J.lvl}` : "";
    let day;
    if (!J.today) day = `<small>오늘 자료 없음</small>`;
    else if ((J.day_net || 0) > 0) day = `오늘 순매수 거래량의 ${J.day_pct ?? "-"}%`;
    else if ((J.day_net || 0) < 0) day = `<span class="d">오늘 순매도 ${J.day_pct == null ? "-" : Math.abs(J.day_pct)}%</span>`;
    else day = "오늘 거래 없음";
    return `<div class="jp">주요거래원: <b>${esc(J.name)}</b>${J.kind ? ` <small>${esc(J.kind)}</small>` : ""} · 집중도 ${J.conc ?? "-"}%${lvl} · ${day}${J.ok ? ' <span class="okm">✓</span>' : ""}</div>`;
}
function frgText(t) {   // (10/18) 당일 외국계 창구 추정 (키움 OPT10040, 상위 거래원 기준)
    const F = t.frg;
    if (!F) return "";
    const n = F.net || 0, man = (v) => (Math.abs(v) / 10000).toFixed(1) + "만";
    const p = F.pct != null ? ` (거래량의 ${Math.abs(F.pct)}%)` : "";
    const body = n > 0 ? `순매수 ${num(n)}주${p}` : n < 0 ? `<span class="d">순매도 ${num(-n)}주${p}</span>` : "거래 없음";
    return `<div class="jp">외국계: ${body} <small>매도 ${man(F.sell)} · 매수 ${man(F.buy)}</small></div>`;
}
function typeText(t) {
    const turn = (t.lx || {}).turn, price = t.price;
    if (!price) return "";
    const weak = price >= TYPE_PRICE && (turn || 0) < TYPE_TURN;
    const good = price < TYPE_PRICE || (turn || 0) >= TYPE_TURN;
    return `<div class="jp">유형: 주가 ${num(price)}원 · 회전율 ${turn ?? "-"}%`
        + (weak ? ' <b class="rwarn">⚠ 약한 유형</b>' : good ? ' <span class="okm">✓</span>' : "") + `</div>`;
}
function renderTopCard() {
    const t = DATA.find((r) => r.top1);
    const info = t ? `<div class="tinfo"><div class="h">
        <b class="nm" data-c="${esc(t.code)}">${esc(t.name)}</b><small>${esc(t.code)}</small>
        <span class="g ${esc(t.cg)}">${esc(t.cg || "-")}</span> <small>종가 점수 ${t.cs ?? "-"} · ${pct(t.lx.chg)}</small></div>
        <div class="sell">${resText(t)}</div>${jpText(t)}${frgText(t)}${typeText(t)}</div>`
        : `<div class="tinfo"><div class="sell">오늘은 원탑 종목이 없어요.</div></div>`;
    $("topcard").innerHTML = `<div class="tc tg">${marketGauge()}${info}</div>`;
    if (t) $("topcard").querySelector(".nm").addEventListener("click", () => show(t.code));

function renderTopRep() {
    const T = META.toprep;
    if (!T || !T.rows || !T.rows.length) return "";
    const S = T.sum;
    const head = S ? `<p class="sub">결과가 나온 ${S.n}일 · 저항·10시 매도 거래당 평균 ${pct(S.avg)} · 이익 본 날 ${S.win}% · 누적 ${pct(S.total)}`
        + (S.rn ? ` · 쉬는 날 뺀 ${S.rn}일 평균 ${pct(S.ravg)} · 이익 본 날 ${S.rwin}%` : "") + ` (비용 0.25% 뺀 값)</p>`
        : `<p class="sub">다음 날 다시 실행하면 오늘 1등의 결과가 채워져요.</p>`;
    const rows = T.rows.map((x) => `<tr><td>${esc(x.run_date)}</td><td><b>${esc(x.name || x.code)}</b><br><small>${esc(x.code)}</small></td>

        <td>${x.rule_at ? esc(x.rule_at) : "저항·10:00 예정"}${x.skip ? ' <b class="rwarn">쉬는 날</b>' : ""}</td><td>${x.rule == null ? "-" : pct(x.rule)}</td>
        <td>${x.res ? num(x.res) + "원" : "-"}</td><td>${pct(x.x930)}</td><td>${pct(x.x1000)}</td>

        <div class="card"><table><thead><tr><th>날짜</th><th>1등</th><th>종가 등급</th><th>매도</th><th>결과</th><th>저항</th><th>9:30</th><th>10:00</th><th>거래원·유형</th></tr></thead>

function renderReport() {
    const R = META.report;
    if (!R) {
        $("report").innerHTML = renderTopRep() + `<div class="rep"><h3>📈 성적표</h3><p class="sub">내일 다시 실행하면 오늘 종목의 다음 날 결과(시가·고가·종가)가 여기에 쌓여요.</p></div>`;

        <div class="card"><table><thead><tr><th>종가 등급</th><th>건수</th><th>시가</th><th>고가</th><th>종가</th><th>시가 상승</th></tr></thead>
        <tbody>${tb}</tbody></table></div>

        <tbody>${rc}</tbody></table></div></div>`;

function fireHtml(B) {   // (10/22) 첫 화면 '오늘의 신호': 오늘 새로 나온 신호 + 진행 중인 불꽃 (한 줄 목록, 누르면 손절·익절선)
    const R = ((B && B.rows) || []).filter((x) => x.days === 0 || (x.best && x.state === "wait"));
    if (!R.length) return "";
    R.sort((a, b) => (b.best - a.best) || (b.room - a.room) || (a.days - b.days));
    const dd = (d) => `${d.slice(4, 6)}/${d.slice(6, 8)}`;
    const row = (x) => `<details><summary><span class="sg-i">${x.best ? "🔥" : ""}</span><span class="sg-n">${esc(x.name)}${x.room ? " ⭐" : ""}</span><span class="sg-p">${num(x.c)}</span><span class="sg-d">${x.days === 0 ? "새로" : x.days + "일 전"}</span></summary>
        <div class="sg-x">신호 ${dd(x.d)} · 손절선 ${num(x.stop)} · 익절선 ${num(x.mid)}${x.warn.length ? `<br>⚠ ${esc(x.warn.join(" · "))}` : ""}</div></details>`;
    return `<div class="fireban"><div class="ft">오늘의 신호<span>${R.length}</span></div>${R.map(row).join("")}</div>`;
}
function renderBottom() {

        <tbody>${rows}</tbody></table></div>` : `<div class="empty">최근 ${B.days}거래일 안에 바닥 타점이 나온 종목이 없어요.</div>`;
    $("bottom").innerHTML = `<div class="rep"><h3>🎯 바닥 타점 · 초록 화살표 + 밴드 하단 (최근 ${B.days}거래일)</h3>
        <p class="sub">🔥 불꽃 = Ratio -0.1 아래 + Speed 2일 연속 상승 (20일 +9.1%, 승률 54%) · 매수 = 신호 날 종가 · 손절선 = 신호 봉 시가 (종가로 깨면) · 익절선 = 밴드 상단 (닿으면 팔기, 평균 4.7일) · ✅ 익절 = 신호 뒤 밴드 상단에 닿음 · ❌ 손절 = 종가가 손절선 아래 · 일봉 ${esc(B.made)} 기준 · 전체 검증: 20일 +5.3% (참고용)</p>${body}</div>`;
}
function renderLog() {   // (10/22) 📒 불꽃 실전 기록: 주도주 실행 때마다 자동으로 쌓임 (사지 않은 종목 포함)

    $("blog").innerHTML = `<div class="rep blog"><h3>📒 불꽃 실전 기록</h3>
        <p class="sub">주도주를 실행할 때마다 저절로 쌓여요 (사지 않은 종목 포함)${G.since ? ` · ${dd(G.since)}부터` : ""} · 신호 날 종가 매수 · 밴드 상단 익절 / 종가 손절 · 비용 ${cost}% 뺀 값 · 참고용</p>
        <div class="card" style="overflow-x:auto"><table><thead><tr><th>구분</th><th>끝남 / 전체</th><th>승률</th><th>손익비</th><th>거래당</th><th>보유</th></tr></thead><tbody>
        ${line("🔥 불꽃", S.fire)}${line("⭐ 여유 2배", S.room)}${line("🎯 바닥 타점", S.base)}
        <tr class="ref"><td>검증 🔥</td><td>163</td><td>64%</td><td>1.33</td><td>+3.6%</td><td>4.7일</td></tr></tbody></table></div>
        ${G.rows.length ? `<div class="card" style="overflow-x:auto"><table><thead><tr><th>종목</th><th>신호일</th><th>결과</th><th>보유</th></tr></thead><tbody>${list}</tbody></table></div>` : ""}</div>`;
}
$("fire").innerHTML = fireHtml(META.bottom);
renderBottom();

renderReport();
renderTopCard();

render();
